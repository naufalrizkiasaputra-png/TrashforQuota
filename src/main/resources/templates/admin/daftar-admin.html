<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Admin - TrashID</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style-admin.css}">
</head>
<body>

    <div class="sidebar shadow">
        <div class="brand-area d-flex align-items-center">
            <i class="bi bi-recycle me-2 text-warning"></i> TrashForQuota
        </div>
        <div class="mt-3">
            <a th:href="@{/admin/home}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            
            <div sec:authorize="hasRole('SUPER_ADMIN')">
                <a th:href="@{/admin/daftar-admin}" class="active">
                    <i class="bi bi-people-fill me-2"></i> Kelola Daftar Admin
                </a>
            </div>
            
            <a th:href="@{/admin/reward}"><i class="bi bi-credit-card me-2"></i> Manajemen Reward</a>
            <a th:href="@{/admin/smart-bin}"><i class="bi bi-trash me-2"></i> Monitoring Bin</a>
            <a th:href="@{/admin/sampah}"><i class="bi bi-gear me-2"></i> Kategori - Sampah</a>
            <hr class="mx-3 text-white-50">
            <a th:href="@{/user/home}" class="text-warning fw-semibold"><i class="bi bi-house-door me-2"></i> Lihat Beranda User</a>
            <a th:href="@{/login}" class="text-white-50 mt-4 small"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius: 12px;">
            <i class="bi bi-check-circle-fill me-2"></i> Aksi Admin Berhasil Diproses!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card bg-white shadow-sm">
            <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-success fw-bold"><i class="bi bi-people-fill me-1"></i> Daftar Admin Sistem</h5>
                
                <button sec:authorize="hasRole('SUPER_ADMIN')" class="btn btn-sm btn-primary rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#modalAddAdmin">
                    <i class="bi bi-plus-lg me-1"></i> Tambah Admin
                </button>
            </div>
            
            <div class="card-body px-4 pb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border-0">
                        <thead class="table-light">
                            <tr>
                                <th class="p-3 border-0">Username</th>
                                <th class="p-3 border-0">No HP</th>
                                <th sec:authorize="hasRole('SUPER_ADMIN')" class="p-3 border-0 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="adm : ${admins}">
                                <td class="p-3 fw-semibold text-dark" th:text="${adm.username}"></td>
                                <td class="p-3 text-muted" th:text="${adm.nomorHp}"></td>
                                
                                <td sec:authorize="hasRole('SUPER_ADMIN')" class="p-3 text-center">
                                    <div class="d-flex justify-content-center gap-1">
                                        <button class="btn btn-sm btn-outline-primary rounded-circle p-1 d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" data-bs-toggle="modal" th:data-bs-target="'#modalEdit' + ${adm.id}">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        
                                        <a th:href="@{/admin/user/delete-admin/{id}(id=${adm.id})}" class="btn btn-sm btn-outline-danger rounded-circle p-1 d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" onclick="return confirm('Apakah Anda yakin ingin menghapus admin ini?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>

                                    <div class="modal fade" th:id="'modalEdit' + ${adm.id}" tabindex="-1">
                                        <div class="modal-dialog text-start modal-dialog-centered">
                                            <div class="modal-content">
                                                <form th:action="@{/admin/user/update-admin}" method="post">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title fw-bold text-success">Edit Admin: <span th:text="${adm.username}"></span></h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <input type="hidden" name="id" th:value="${adm.id}">
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-bold text-muted">Username</label>
                                                            <input type="text" class="form-control bg-light" th:value="${adm.username}" readonly style="border-radius: 10px; padding: 10px;">
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-bold text-muted">Nomor HP</label>
                                                            <input type="text" name="noHp" class="form-control" th:value="${adm.nomorHp}" required style="border-radius: 10px; padding: 10px;">
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-bold text-muted">Password Baru</label>
                                                            <input type="password" name="password" class="form-control" placeholder="Kosongkan jika tidak ingin ganti" style="border-radius: 10px; padding: 10px;">
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-0">
                                                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Simpan Perubahan</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div sec:authorize="hasRole('SUPER_ADMIN')" class="modal fade" id="modalAddAdmin" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/admin/user/create-admin}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold text-success"><i class="bi bi-person-plus-fill me-1"></i> Tambah Admin Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Masukkan Username" required style="border-radius: 10px; padding: 10px;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Masukkan Password" required style="border-radius: 10px; padding: 10px;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">No HP</label>
                            <input type="text" name="noHp" class="form-control" placeholder="Masukkan Nomor Handphone" required style="border-radius: 10px; padding: 10px;">
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Simpan Admin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
