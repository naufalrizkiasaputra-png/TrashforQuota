<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kelola Admin - TrashID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #212529; padding-top: 20px; z-index: 100; }
        .sidebar a { padding: 12px 20px; color: #adb5bd; text-decoration: none; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #343a40; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <div class="px-4 mb-4 text-white"><h4>TrashID Admin</h4></div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/daftar-admin" class="active"><i class="bi bi-shield-lock"></i> Daftar Admin</a>
        <a href="/admin/penukaran"><i class="bi bi-credit-card"></i> Penukaran Poin</a>
        <a href="/admin/smart-bin"><i class="bi bi-trash"></i> Smart Bin</a>
        <a href="/admin/konfigurasi"><i class="bi bi-gear"></i> Konfigurasi</a>
        <hr class="mx-3 text-secondary">
        <a href="/login" class="text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <div class="main-content">
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> Aksi Admin Berhasil Diproses!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-primary fw-bold">Daftar Admin Sistem</h5>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddAdmin">Tambah Admin</button>
            </div>
            <div class="card-body">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>No HP</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="adm : ${admins}">
                            <td th:text="${adm.username}"></td>
                            <td th:text="${adm.nomorHp}"></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary border-0 me-2" data-bs-toggle="modal" th:data-bs-target="'#modalEdit' + ${adm.id}">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <a th:href="@{/admin/user/delete-admin/{id}(id=${adm.id})}" class="btn btn-sm btn-outline-danger border-0" onclick="return confirm('Hapus admin?')">
                                    <i class="bi bi-trash"></i>
                                </a>

                                <div class="modal fade" th:id="'modalEdit' + ${adm.id}" tabindex="-1">
                                    <div class="modal-dialog text-start">
                                        <div class="modal-content">
                                            <form th:action="@{/admin/user/update-admin}" method="post">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Edit Admin: <span th:text="${adm.username}"></span></h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <input type="hidden" name="id" th:value="${adm.id}">
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Username</label>
                                                        <input type="text" class="form-control bg-light" th:value="${adm.username}" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Nomor HP</label>
                                                        <input type="text" name="noHp" class="form-control" th:value="${adm.nomorHp}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Password Baru</label>
                                                        <input type="password" name="password" class="form-control" placeholder="Kosongkan jika tidak ingin ganti">
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAddAdmin" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/user/create-admin}" method="post">
                    <div class="modal-header"><h5 class="modal-title">Tambah Admin Baru</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
                        <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
                        <div class="mb-3"><input type="text" name="noHp" class="form-control" placeholder="No HP" required></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-primary w-100">Simpan</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
