<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - TrashID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #212529; padding-top: 20px; z-index: 100; }
        .sidebar a { padding: 12px 20px; color: #adb5bd; text-decoration: none; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #343a40; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card { border-radius: 12px; border: none; margin-bottom: 25px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table thead { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <div class="px-4 mb-4 text-white"><h4>TrashID Admin</h4></div>
        <a href="#" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#admin-list"><i class="bi bi-shield-lock"></i> Daftar Admin</a>
        <a href="#item-config"><i class="bi bi-gear"></i> Konfigurasi</a>
        <hr class="mx-3 text-secondary">
        <a href="/login" class="text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <div class="main-content">
        
        <div class="row">
            <div class="col-12" id="admin-list">
                <div class="card">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-primary fw-bold">Daftar Admin Sistem</h5>
                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddAdmin">
                            <i class="bi bi-plus-lg"></i> Tambah Admin
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Nomor HP</th>
                                        <th>Role</th>
                                        <th class="text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="adm : ${admins}">
                                        <td th:text="${adm.username}" class="fw-bold"></td>
                                        <td th:text="${adm.nomorHp}"></td>
                                        <td><span class="badge bg-info-subtle text-info border border-info-subtle" th:text="${adm.role}"></span></td>
                                        <td class="text-center">
                                            <button class="btn btn-sm btn-outline-primary border-0" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${adm.id}">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                            <a th:href="@{/admin/user/delete-admin/{id}(id=${adm.id})}" class="btn btn-sm btn-outline-danger border-0" onclick="return confirm('Hapus admin ini?')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                            
                                            <div class="modal fade" th:id="'editModal' + ${adm.id}" tabindex="-1">
                                                <div class="modal-dialog text-start">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/user/update-admin}" method="post">
                                                            <div class="modal-header"><h5 class="modal-title">Update Data Admin</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                                            <div class="modal-body">
                                                                <input type="hidden" name="id" th:value="${adm.id}">
                                                                <div class="mb-3"><label class="small fw-bold">Username</label><input type="text" class="form-control" th:value="${adm.username}" disabled></div>
                                                                <div class="mb-3"><label class="small fw-bold">Nomor HP</label><input type="text" name="noHp" class="form-control" th:value="${adm.nomorHp}" required></div>
                                                                <div class="mb-3"><label class="small fw-bold">Password Baru (Kosongkan jika tidak diganti)</label><input type="password" name="password" class="form-control"></div>
                                                            </div>
                                                            <div class="modal-footer border-0"><button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button></div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="item-config">
            <div class="card-header bg-white py-3"><h5 class="mb-0 text-success fw-bold"><i class="bi bi-gear-fill"></i> Pengaturan Item Sampah</h5></div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <form th:action="@{/admin/item/save}" method="post" class="p-3 border rounded-3 bg-light">
                            <h6 class="fw-bold mb-3">Tambah Jenis Sampah</h6>
                            <div class="mb-2"><input type="text" name="jenis" class="form-control" placeholder="Nama Sampah" required></div>
                            <div class="mb-3"><input type="number" name="nilaiPoinPerGram" class="form-control" placeholder="Poin per gram" required></div>
                            <button type="submit" class="btn btn-success w-100 btn-sm fw-bold">SIMPAN ITEM</button>
                        </form>
                    </div>
                    <div class="col-md-8">
                        <div class="row g-3">
                            <div th:each="i : ${items}" class="col-md-6 col-lg-4">
                                <div class="p-3 border rounded-3 d-flex justify-content-between align-items-center bg-white shadow-sm">
                                    <div>
                                        <span class="fw-bold d-block" th:text="${i.jenis}"></span>
                                        <small class="text-muted" th:text="${i.nilaiPoinPerGram} + ' poin/g'"></small>
                                    </div>
                                    <a th:href="@{/admin/item/delete/{id}(id=${i.idItem})}" class="btn btn-link text-danger p-0" onclick="return confirm('Hapus item ini?')"><i class="bi bi-trash"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAddAdmin" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/user/create-admin}" method="post">
                    <div class="modal-header"><h5 class="modal-title fw-bold">Daftarkan Admin Baru</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><label class="small fw-bold">Username</label><input type="text" name="username" class="form-control" placeholder="Masukkan username" required></div>
                        <div class="mb-3"><label class="small fw-bold">Password</label><input type="password" name="password" class="form-control" placeholder="Masukkan password" required></div>
                        <div class="mb-3"><label class="small fw-bold">Nomor HP</label><input type="text" name="noHp" class="form-control" placeholder="08xxxxxxxxxx" required></div>
                    </div>
                    <div class="modal-footer border-0"><button type="submit" class="btn btn-primary w-100">Simpan Akun Admin</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
