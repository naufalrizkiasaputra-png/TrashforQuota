<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - TrashID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #212529; padding-top: 20px; z-index: 100; }
        .sidebar a { padding: 12px 20px; color: #adb5bd; text-decoration: none; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #343a40; }
        .main-content { margin-left: 250px; padding: 30px; }
        .card { border-radius: 12px; border: none; margin-bottom: 25px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .stat-card { border-left: 5px solid; }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <div class="px-4 mb-4 text-white"><h4>TrashID Admin</h4></div>
        <a href="/admin/home" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/daftar-admin"><i class="bi bi-shield-lock"></i> Daftar Admin</a>
        <a href="/admin/reward"><i class="bi bi-credit-card"></i> Reward</a>
        <a href="/admin/smart-bin"><i class="bi bi-trash"></i> Smart Bin</a>
        <a href="/admin/konfigurasi"><i class="bi bi-gear"></i> Konfigurasi</a>
        <hr class="mx-3 text-secondary">
        <a href="/login" class="text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="mb-4">
            <h3>Selamat Datang di Panel Control TrashID</h3>
            <p class="text-muted">Gunakan menu di samping untuk memanajemen sistem penukaran sampah.</p>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card stat-card border-primary bg-white">
                    <div class="card-body">
                        <h6 class="text-muted mb-1">Total Pengguna</h6>
                        <h2 class="mb-0 fw-bold" th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card border-success bg-white">
                    <div class="card-body">
                        <h6 class="text-muted mb-1">Total Sampah (Gram)</h6>
                        <h2 class="mb-0 fw-bold" th:text="${totalSampah}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card border-warning bg-white">
                    <div class="card-body">
                        <h6 class="text-muted mb-1">Pending Penukaran</h6>
                        <h2 class="mb-0 fw-bold" th:text="${pendingTransactions.size()}">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
