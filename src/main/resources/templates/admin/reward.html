<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kelola Reward - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <!-- LANGKAH 3: Link Kembali ke Dashboard -->
            <a class="navbar-brand fw-bold text-white" th:href="@{/admin/home}">
                <i class="bi bi-arrow-left-circle-fill me-2 text-white"></i> Kembali ke Dashboard
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark">Daftar Reward (Kuota & Pulsa)</h5>
                <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#modalTambahReward">
                    <i class="bi bi-plus-lg"></i> Tambah Reward Baru
                </button>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr><th>Nama Reward</th><th>Provider</th><th>Harga Poin</th><th class="text-center">Aksi</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${rewards}">
                            <td class="fw-bold" th:text="${r.namaReward}"></td>
                            <td th:text="${r.provider}"></td>
                            <td class="text-danger fw-bold"><i class="bi bi-coin"></i> <span th:text="${r.poinDibutuhkan}"></span> Pts</td>
                            <td class="text-center">
                                <a th:href="@{'/admin/reward/delete/' + ${r.idReward}}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Hapus?')">Hapus</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Tambah Reward -->
    <div class="modal fade" id="modalTambahReward" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/reward/save-kuota}" th:object="${newKuota}" method="post">
                    <div class="modal-header"><h5>Input Data Reward</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><label class="form-label text-dark">Nama Reward</label><input type="text" th:field="*{namaReward}" class="form-control" required></div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label text-dark">Provider</label>
                                <select th:field="*{provider}" class="form-select">
                                    <option value="Telkomsel">Telkomsel</option><option value="Indosat">Indosat</option><option value="XL">XL</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3"><label class="form-label text-dark">Poin</label><input type="number" th:field="*{poinDibutuhkan}" class="form-control" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label text-dark">Jumlah GB</label><input type="number" step="0.1" th:field="*{jumlahGb}" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label text-dark">Masa Aktif</label><input type="number" th:field="*{masaAktifHari}" class="form-control" required></div>
                        </div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-primary">Simpan</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
