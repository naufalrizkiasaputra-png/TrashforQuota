<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <title>Konfigurasi Sistem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Inter', sans-serif;
            background: #f4f9f6;
        }

        /* SIDEBAR */

        .sidebar{
            height: 100vh;
            width: 260px;
            position: fixed;
            background: linear-gradient(180deg,#198754,#157347);
            padding-top: 20px;
            z-index: 100;
        }

        .sidebar .brand-area{
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            padding: 10px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar a{
            padding: 13px 20px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            display: block;
            font-weight: 500;
            transition: .2s;
        }

        .sidebar a:hover{
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .sidebar a.active{
            background: #146c43;
            color: white;
            border-left: 4px solid #20c997;
        }

        /* MAIN */

        .main-content{
            margin-left: 260px;
            padding: 35px;
        }

        .hero-box{
            background: linear-gradient(135deg,#198754,#20c997);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            color: white;
        }

        .hero-circle{
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            position: absolute;
            top: -60px;
            right: -50px;
        }

        .card{
            border: none;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(25,135,84,0.05);
        }

        .form-control{
            border-radius: 14px;
            padding: 12px;
        }

        .form-label{
            font-weight: 600;
            margin-bottom: 10px;
            color: #198754;
        }

        .btn-success{
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 600;
        }

        .config-icon{
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #e9fff3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #198754;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar shadow">

    <div class="brand-area d-flex align-items-center">

        <i class="bi bi-recycle me-2 text-warning"></i>
        TrashForQuota

    </div>

    <div class="mt-3">

        <a href="/admin/home">

            <i class="bi bi-speedometer2 me-2"></i>
            Dashboard

        </a>

        <a href="/admin/reward">

            <i class="bi bi-gift me-2"></i>
            Kelola Reward

        </a>

        <a href="/admin/smart-bins">

            <i class="bi bi-trash3 me-2"></i>
            Monitoring Bin

        </a>

        <a href="/admin/config" class="active">

            <i class="bi bi-gear me-2"></i>
            Konfigurasi

        </a>

        <a href="/admin/sampah">

            <i class="bi bi-upc-scan me-2"></i>
            Scan Sampah

        </a>

        <hr class="mx-3 text-white-50">

        <a href="/dashboard"
           class="text-warning fw-semibold">

            <i class="bi bi-house-door me-2"></i>
            Lihat User

        </a>

        <form th:action="@{/logout}"
              method="post"
              class="px-3 mt-4">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button class="btn btn-outline-light w-100 rounded-pill">

                <i class="bi bi-box-arrow-left me-2"></i>
                Logout

            </button>

        </form>

    </div>

</div>

<!-- MAIN -->
<div class="main-content">

    <!-- HERO -->
    <div class="hero-box p-4 mb-4 shadow">

        <div class="hero-circle"></div>

        <div class="row align-items-center position-relative">

            <div class="col-md-8">

                <h2 class="fw-bold mb-2">
                    ⚙️ Konfigurasi Sistem
                </h2>

                <p class="opacity-75 mb-0">
                    Atur sistem poin, reward,
                    dan aturan minimum penukaran pengguna.
                </p>

            </div>

            <div class="col-md-4 text-end d-none d-md-block">

                <i class="bi bi-sliders"
                   style="font-size:90px;opacity:.85;"></i>

            </div>

        </div>

    </div>

    <!-- CONFIG CARD -->
    <div class="card">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h4 class="fw-bold text-success mb-1">
                        Pengaturan Sistem
                    </h4>

                    <small class="text-muted">
                        Sesuaikan aturan perhitungan poin
                    </small>

                </div>

                <div class="config-icon">
                    ⚙️
                </div>

            </div>

            <form method="post"
                  action="/admin/config/save">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <input type="hidden"
                       name="id"
                       th:value="${config.id}">

                <div class="row">

                    <!-- ORGANIK -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            🌱 Poin Organik

                        </label>

                        <input type="number"
                               name="poinOrganik"
                               class="form-control"
                               th:value="${config.poinOrganik}">

                    </div>

                    <!-- ANORGANIK -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            ♻️ Poin Anorganik

                        </label>

                        <input type="number"
                               name="poinAnorganik"
                               class="form-control"
                               th:value="${config.poinAnorganik}">

                    </div>

                    <!-- B3 -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            ☣️ Poin B3

                        </label>

                        <input type="number"
                               name="poinB3"
                               class="form-control"
                               th:value="${config.poinB3}">

                    </div>

                    <!-- MINIMAL -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            💰 Minimal Tukar Poin

                        </label>

                        <input type="number"
                               name="minimalTukar"
                               class="form-control"
                               th:value="${config.minimalTukar}">

                    </div>

                </div>

                <button class="btn btn-success px-4">

                    <i class="bi bi-check-circle me-2"></i>
                    Simpan Konfigurasi

                </button>

            </form>

        </div>

    </div>

</div>

<!-- SWEET ALERT -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">

    const success =
        new URLSearchParams(window.location.search)
            .get('success');

    if(success === 'save'){

        Swal.fire({

            icon: 'success',

            title: 'Berhasil!',

            text: 'Konfigurasi berhasil disimpan ⚙️',

            confirmButtonColor: '#198754'

        });

    }

</script>

</body>
</html>
