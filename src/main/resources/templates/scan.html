<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scan Sampah - TrashID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <a href="/dashboard" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-4 text-success">
                <i class="bi bi-recycle"></i> Scan Sampah
            </h4>

            <form th:action="@{/scan}" method="post">
                <div class="row g-3">
                    <div th:each="item : ${items}" class="col-md-4">
                        <div class="p-3 border rounded-3 bg-white">
                            <label class="form-label small fw-bold text-muted" 
                                   th:text="${item.jenis} + ' (gram)'"></label>
                            
                            <input type="number" 
                                   th:name="'berat_' + ${item.idItem}" 
                                   class="form-control" 
                                   placeholder="0" 
                                   min="0">
                            
                            <div class="mt-1">
                                <small class="badge bg-success-subtle text-success border border-success-subtle" 
                                       th:text="${item.nilaiPoinPerGram} + ' Poin/gram'"></small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm">
                        Hitung Poin
                    </button>
                </div>
            </form>

            <div th:if="${hasilPoin != null}" class="alert alert-success mt-4 border-0 shadow-sm d-flex align-items-center">
                <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                <div>
                    Total Poin yang didapatkan: <strong class="fs-5" th:text="${hasilPoin}"></strong> Poin
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
