<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - TrashforQuota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <nav class="bg-green-600 p-4 text-white shadow-md w-full">
        <div class="flex justify-between items-center px-6">
            <h1 class="text-2xl font-bold italic tracking-tighter text-white">TrashforQuota</h1>
            <a th:href="@{/user/home}" class="flex items-center gap-2 bg-white/20 hover:bg-white/30 px-5 py-2 rounded-full transition-all border border-white/30 text-sm font-semibold">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </nav>

    <main class="flex flex-col md:flex-row min-h-[calc(100vh-72px)] w-full">
        
        <div class="w-full md:w-1/3 bg-white border-r border-gray-200 flex flex-col items-center justify-center p-10 shadow-sm">
            <form id="uploadForm" th:action="@{/user/profil/upload}" method="post" enctype="multipart/form-data" class="hidden">
                <input type="file" id="fileInput" name="file" onchange="document.getElementById('uploadForm').submit()">
            </form>

            <div class="relative group cursor-pointer" onclick="document.getElementById('fileInput').click()">
                <img th:src="${user.foto != null ? '/img/uploads/' + user.foto : 'https://ui-avatars.com/api/?name=' + user.username + '&background=random&size=250'}"
                     class="w-48 h-48 md:w-64 md:h-64 rounded-full border-8 border-green-50 shadow-2xl object-cover transition-all group-hover:brightness-75" 
                     alt="Foto Profil">
                
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-white font-bold bg-black/50 px-4 py-2 rounded-full text-xs">Ganti Foto</span>
                </div>
            </div>
            
            <h2 class="text-3xl font-extrabold text-gray-800 mt-6" th:text="${user.username}">Username</h2>
            
            <div class="mt-2">
                <span th:if="${user.poin >= 1000}" class="px-4 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-black border border-purple-200 uppercase tracking-tighter italic">Pandawara</span>
                <span th:if="${user.poin < 1000 and user.poin >= 500}" class="px-4 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-black border border-blue-200 uppercase tracking-tighter italic">Clean Freak</span>
                <span th:if="${user.poin < 500}" class="px-4 py-1 bg-green-100 text-green-700 rounded-full text-xs font-black border border-green-200 uppercase tracking-tighter italic">Germaphobe</span>
            </div>
            
            <button onclick="document.getElementById('fileInput').click()" class="mt-4 text-xs text-blue-500 hover:underline italic font-bold">
                <i class="fas fa-camera mr-1"></i> Ubah Foto Profil
            </button>

            <div class="mt-10 w-full max-w-xs pt-6 border-t border-gray-100">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full flex items-center justify-center gap-3 bg-red-50 text-red-600 border border-red-100 py-3 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-sign-out-alt"></i> Keluar
                    </button>
                </form>
            </div>
        </div>

        <div class="w-full md:w-2/3 p-6 md:p-16 bg-gray-50/50">
            <div class="max-w-4xl">
                <div th:if="${message}" class="mb-6 p-4 bg-green-500 text-white rounded-2xl shadow-lg shadow-green-200 flex items-center gap-3 font-bold animate-bounce">
                    <i class="fas fa-check-circle text-xl"></i> <span th:text="${message}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-500 text-white rounded-2xl shadow-lg shadow-red-200 flex items-center gap-3 font-bold">
                    <i class="fas fa-exclamation-circle text-xl"></i> <span th:text="${error}"></span>
                </div>

                <div class="flex justify-between items-end mb-8">
                    <h3 class="text-2xl font-black text-gray-800 uppercase tracking-tight italic">
                        <i class="fas fa-user-cog text-green-600 mr-2"></i> Pengaturan Akun
                    </h3>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">ID Kamu</p>
                        <p class="text-xl font-black text-green-600" th:text="'#' + ${user.id}">#00</p>
                    </div>
                </div>

                <form th:action="@{/user/profil/update}" method="post" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Nama Pahlawan</label>
                            <div class="relative">
                                <i class="fas fa-user absolute left-0 top-1/2 -translate-y-1/2 text-gray-300"></i>
                                <input type="text" name="username" th:value="${user.username}" 
                                       class="w-full pl-8 py-2 bg-transparent border-b-2 border-gray-100 focus:border-green-500 outline-none transition-all font-bold text-gray-700">
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Nomor WhatsApp</label>
                            <div class="relative">
                                <i class="fas fa-phone-alt absolute left-0 top-1/2 -translate-y-1/2 text-gray-300"></i>
                                <input type="text" name="noHp" th:value="${user.noHp}" placeholder="Contoh: 08123456789"
                                       class="w-full pl-8 py-2 bg-transparent border-b-2 border-gray-100 focus:border-green-500 outline-none transition-all font-bold text-gray-700">
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-800 p-8 rounded-[2.5rem] shadow-xl text-white flex flex-col md:flex-row justify-between items-center gap-6">
                        <div>
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Total Poin Saat Ini</p>
                            <div class="flex items-center gap-2">
                                <span class="text-5xl font-black text-green-400" th:text="${user.poin}">0</span>
                                <span class="text-xl font-bold text-gray-500 italic">XP</span>
                            </div>
                        </div>
                        <button type="submit" class="w-full md:w-auto bg-green-500 hover:bg-green-400 text-white px-10 py-4 rounded-2xl font-black uppercase tracking-tighter transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-green-900/20">
                            Simpan Perubahan <i class="fas fa-save ml-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
