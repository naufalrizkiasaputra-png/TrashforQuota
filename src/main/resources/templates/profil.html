<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - TrashforQuota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style-subpage.css}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen selection:bg-green-500 selection:text-white">

    <nav class="bg-gradient-to-r from-green-600 via-green-600 to-emerald-700 p-4 text-white shadow-lg sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4 md:px-6">
            <div class="flex items-center gap-2 group">
                <div class="bg-white/10 p-2 rounded-xl border border-white/20 shadow-inner group-hover:scale-110 transition-transform">
                    <i class="fas fa-recycle text-emerald-300 text-xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold italic tracking-tight bg-gradient-to-r from-white to-emerald-100 bg-clip-text text-transparent">TrashforQuota</h1>
            </div>
            <a th:href="@{/user/home}" class="flex items-center gap-2 bg-white/10 hover:bg-white text-white hover:text-green-700 px-5 py-2.5 rounded-2xl transition-all duration-300 border border-white/20 hover:border-white shadow-md font-bold text-sm tracking-wide">
                <i class="fas fa-arrow-left text-xs"></i> Kembali ke Beranda
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 md:py-12 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 flex flex-col items-center">
            <div class="w-full bg-white rounded-3xl p-8 border border-slate-100 shadow-xl shadow-slate-200/50 relative overflow-hidden flex flex-col items-center group/sidebar">
                
                <div class="absolute -top-24 -left-24 w-48 h-48 bg-green-400/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-400/10 rounded-full blur-3xl pointer-events-none"></div>

                <form id="uploadForm" th:action="@{/user/profil/upload}" method="post" enctype="multipart/form-data" class="hidden">
                    <input type="file" id="fileInput" name="file" onchange="document.getElementById('uploadForm').submit()">
                </form>
                
                <div class="relative cursor-pointer group/avatar mt-4" onclick="document.getElementById('fileInput').click()">
                    <div class="absolute -inset-1.5 bg-gradient-to-tr from-green-500 to-emerald-400 rounded-full blur opacity-25 group-hover/avatar:opacity-70 transition duration-500 group-hover/avatar:duration-200 animate-pulse"></div>
                    
                    <img th:src="${user.foto != null ? '/img/uploads/' + user.foto : 'https://ui-avatars.com/api/?name=' + user.username + '&background=random&size=250'}"
                         class="relative w-48 h-48 rounded-full border-4 border-white shadow-xl object-cover transition-all duration-500 group-hover/avatar:scale-95 group-hover/avatar:brightness-75" 
                         alt="Foto Profil">
                    
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover/avatar:opacity-100 transition-all duration-300 rounded-full">
                        <span class="text-white font-bold bg-slate-900/80 backdrop-blur-xs px-4 py-2 rounded-full text-xs shadow-lg tracking-wide border border-white/20 transform translate-y-2 group-hover/avatar:translate-y-0 transition-transform">
                            Ganti Foto <i class="fas fa-camera ml-1 text-emerald-400"></i>
                        </span>
                    </div>
                </div>
                
                <h2 class="text-2xl font-black text-slate-800 mt-6 tracking-tight group-hover/sidebar:text-green-600 transition-colors" th:text="${user.username}">Username</h2>
                
                <div class="mt-3 mb-4">
                    <span th:if="${user.poin >= 500000}" class="px-5 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-full text-[11px] font-black shadow-md shadow-amber-500/20 uppercase tracking-widest italic border border-amber-400/30">Earth Guardian</span>
                    <span th:if="${user.poin < 500000 and user.poin >= 100000}" class="px-5 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full text-[11px] font-black shadow-md shadow-purple-500/20 uppercase tracking-widest italic border border-purple-400/30">Pandawara</span>
                    <span th:if="${user.poin < 100000 and user.poin >= 25000}" class="px-5 py-1.5 bg-gradient-to-r from-rose-500 to-red-600 text-white rounded-full text-[11px] font-black shadow-md shadow-rose-500/20 uppercase tracking-widest italic border border-rose-400/30">Eco Warrior</span>
                    <span th:if="${user.poin < 25000 and user.poin >= 5000}" class="px-5 py-1.5 bg-gradient-to-r from-blue-500 to-cyan-500 text-white rounded-full text-[11px] font-black shadow-md shadow-blue-500/20 uppercase tracking-widest italic border border-blue-400/30">Clean Freak</span>
                    <span th:if="${user.poin < 5000}" class="px-5 py-1.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-full text-[11px] font-black shadow-md shadow-green-500/20 uppercase tracking-widest italic border border-green-400/30">Germaphobe</span>
                </div>
                
                <div th:if="${user.foto != null}" class="mt-1">
                    <form th:action="@{/user/profil/photo/delete}" method="post">
                        <button type="submit" class="text-xs text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-4 py-1.5 rounded-xl font-bold tracking-tight transition-all duration-300 flex items-center gap-1.5" 
                                onclick="return confirm('Apakah Anda yakin ingin menghapus foto profil?')">
                            <i class="fas fa-trash text-[10px]"></i> Hapus Foto
                        </button>
                    </form>
                </div>

                <div class="w-full h-[1px] bg-slate-100 my-6"></div>

                <div class="w-full max-w-xs">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="w-full flex items-center justify-center gap-3 bg-slate-50 text-slate-600 border border-slate-200/80 py-3.5 rounded-2xl font-bold hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-all duration-300 shadow-xs hover:shadow-md">
                            <i class="fas fa-sign-out-alt text-sm"></i> Keluar dari Akun
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="w-full bg-white rounded-3xl p-6 md:p-10 border border-slate-100 shadow-xl shadow-slate-200/50">
                
                <div th:if="${message}" class="mb-8 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl shadow-sm flex items-center gap-3 font-semibold text-sm animate-fade-in">
                    <div class="bg-emerald-500 text-white p-1.5 rounded-lg"><i class="fas fa-check-circle"></i></div>
                    <span th:text="${message}"></span>
                </div>
                <div th:if="${error}" class="mb-8 p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl shadow-sm flex items-center gap-3 font-semibold text-sm">
                    <div class="bg-rose-500 text-white p-1.5 rounded-lg"><i class="fas fa-exclamation-circle"></i></div>
                    <span th:text="${error}"></span>
                </div>

                <div class="flex justify-between items-center pb-6 mb-8 border-b border-slate-100">
                    <div class="flex items-center gap-3">
                        <div class="bg-green-50 p-3 rounded-2xl text-green-600">
                            <i class="fas fa-user-gear text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-extrabold text-slate-800 tracking-tight">Pengaturan Profil</h3>
                            <p class="text-xs font-medium text-slate-400 mt-0.5">Kelola informasi kredensial akun pahlawanmu</p>
                        </div>
                    </div>
                    <div class="text-right bg-slate-50 border border-slate-200/60 px-4 py-2 rounded-2xl shadow-inner">
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">ID Pahlawan</p>
                        <p class="text-lg font-black text-green-600" th:text="'#' + ${user.id}">#00</p>
                    </div>
                </div>

                <form th:action="@{/user/profil/update}" method="post" class="space-y-8">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="group/input flex flex-col gap-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Nama Pahlawan</label>
                            <div class="relative flex items-center">
                                <div class="absolute left-4 text-slate-400 group-focus-within/input:text-green-500 transition-colors">
                                    <i class="fas fa-user text-sm"></i>
                                </div>
                                <input type="text" name="username" th:value="${user.username}" required
                                       class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 outline-none transition-all duration-300 font-bold text-slate-700 shadow-inner focus:shadow-none">
                            </div>
                        </div>

                        <div class="group/input flex flex-col gap-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Nomor WhatsApp</label>
                            <div class="relative flex items-center">
                                <div class="absolute left-4 text-slate-400 group-focus-within/input:text-green-500 transition-colors">
                                    <i class="fas fa-phone text-sm"></i>
                                </div>
                                <input type="text" name="noHp" th:value="${user.noHp}" placeholder="Contoh: 08123456789" required
                                       class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 outline-none transition-all duration-300 font-bold text-slate-700 shadow-inner focus:shadow-none">
                            </div>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-slate-800 via-slate-900 to-slate-950 p-6 md:p-8 rounded-[2rem] shadow-xl shadow-slate-900/20 text-white flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden group/banner mt-8">
                        <div class="absolute right-0 top-0 w-36 h-36 bg-green-500/10 rounded-full blur-2xl group-hover/banner:scale-120 transition-transform duration-700 pointer-events-none"></div>
                        
                        <div class="flex items-center gap-4 text-center md:text-left">
                            <div class="bg-white/10 p-4 rounded-2xl border border-white/10 text-green-400 hidden sm:block shadow-inner">
                                <i class="fas fa-star text-2xl animate-spin-slow"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Total Tabungan Poin</p>
                                <div class="flex items-baseline justify-center md:justify-start gap-1.5 mt-1">
                                    <span class="text-4xl md:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300" th:text="${user.poin}">0</span>
                                    <span class="text-sm font-bold text-slate-500 tracking-wider">XP</span>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="w-full md:w-auto bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white px-8 py-4 rounded-2xl font-extrabold uppercase text-sm tracking-wider transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg hover:shadow-green-500/20 active:translate-y-0 shadow-md flex items-center justify-center gap-2">
                            Simpan Perubahan <i class="fas fa-circle-check text-base"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        </main>

    <style>
        .animate-spin-slow {
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>

</body>
</html>
